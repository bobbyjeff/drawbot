<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NVIDIA OG lines — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0c;
        --panel: #141413;
        --panel-elevated: #1a1a18;
        --border: #2a2a28;
        --border-subtle: #1f1f1d;
        --text: #f5f4f1;
        --muted: #8a8880;
        --faint: #5c5b56;
        --track: #2e2e2b;
        --thumb: #eceae4;
        --thumb-border: #0d0d0c;
        --focus: rgba(245, 244, 241, 0.14);
        --controls-width: 196px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.4;
        padding: 16px 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 16px;
        align-items: flex-start;
      }
      h1 { font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 2px; width: 100%; }
      .sub { color: var(--muted); font-size: 0.75rem; margin: 0 0 12px; width: 100%; line-height: 1.5; }
      .sub code { font-size: 0.6875rem; padding: 1px 5px; border-radius: 4px; background: var(--panel-elevated); border: 1px solid var(--border-subtle); color: var(--muted); }
      .preview-wrap { flex: 1 1 520px; min-width: 0; overflow-x: auto; }
      .canvas-shell { display: inline-block; background: #000; border-radius: 8px; border: 1px solid var(--border); line-height: 0; }
      canvas#c { width: 100%; max-width: 1200px; height: auto; aspect-ratio: 2400 / 1260; display: block; }
      .controls { flex: 0 0 var(--controls-width); width: var(--controls-width); max-width: 100%; padding: 0; }
      .controls h2 { font-size: 0.625rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 24px 0 8px; }
      .controls h2:first-child { margin-top: 0; }
      .control { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
      .control .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .control .name { font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; }
      .control .val { font-size: 0.6875rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); flex-shrink: 0; }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 999px; background: var(--track); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--thumb-border); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
      input[type="range"]::-moz-range-track { height: 3px; border-radius: 999px; background: var(--track); border: none; }
      input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--thumb-border); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
      input[type="color"] { width: 32px; height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-elevated); cursor: pointer; padding: 2px; flex-shrink: 0; }
      .color-row { display: flex; align-items: center; gap: 6px; }
      .color-row input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: 0.6875rem; font-family: "SF Mono", "Menlo", monospace; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-elevated); color: var(--text); }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      button { font: inherit; font-size: 0.6875rem; font-weight: 500; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-elevated); color: var(--text); cursor: pointer; }
      button:hover { background: #222220; border-color: #353532; }
      button.primary { background: #2a2a27; border-color: #3d3d39; }
      .timeline { margin-top: 8px; }
      .checkbox-row { flex-direction: row; align-items: center; margin: 0 !important; gap: 6px; font-size: 0.6875rem; color: var(--muted); cursor: pointer; }
      .checkbox-row input { accent-color: var(--thumb); width: 13px; height: 13px; cursor: pointer; }
    </style>
  </head>
  <body>

    <aside class="controls" style="order: 1">
      <h2>Timing</h2>
      <label class="control">
        <span class="row"><span class="name">Total frames</span><span class="val" id="vEmergeFr">120</span></span>
        <input type="range" id="emergeFr" min="30" max="300" value="40" />
      </label>
      <label class="control">
        <span class="row"><span class="name">FPS</span><span class="val" id="vFps">24</span></span>
        <input type="range" id="fps" min="2" max="60" value="24" />
      </label>

      <h2>Style</h2>
      <div class="control">
        <span class="row"><span class="name">Background</span></span>
        <div class="color-row">
          <input type="color" id="bgHex" value="#195460" />
          <input type="text" id="bgText" value="#195460" maxlength="7" />
        </div>
      </div>
      <div class="control">
        <span class="row"><span class="name">Stroke color</span></span>
        <div class="color-row">
          <input type="color" id="fgHex" value="#A88D02" />
          <input type="text" id="fgText" value="#A88D02" maxlength="7" />
        </div>
      </div>
      <div class="control">
        <span class="row"><span class="name">Segment color</span></span>
        <div class="color-row">
          <input type="color" id="segHex" value="#EDECE8" />
          <input type="text" id="segText" value="#EDECE8" maxlength="7" />
        </div>
      </div>
      <label class="control">
        <span class="row"><span class="name">Stroke width</span><span class="val" id="vStrokeW">2</span></span>
        <input type="range" id="strokeW" min="1" max="6" value="2" />
      </label>

      <h2>Export</h2>
      <button type="button" id="exportGif">GIF</button>
      <button type="button" id="exportWebm">WebM</button>
      <button type="button" id="exportMp4">MP4</button>
      <p class="export-status" id="exportStatus" aria-live="polite"></p>
    </aside>

    <div class="preview-wrap" style="order: 2">
      <div class="canvas-shell">
        <canvas id="c" width="2400" height="1260"></canvas>
      </div>
      <div class="timeline">
        <label class="control">
          <span class="row"><span class="name">Scrub</span><span class="val" id="frameLabel">—</span></span>
          <input type="range" id="scrub" min="0" max="0" value="0" />
        </label>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="play">Play</button>
        <button type="button" id="pause">Pause</button>
        <label class="control checkbox-row">
          <input type="checkbox" id="loop" checked />
          Loop
        </label>
      </div>
    </div>

    <script src="vendor/gifjs/gif.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
    <script src="og-nvidia-05-preview.js"></script>
  </body>
</html>
