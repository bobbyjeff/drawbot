<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NVIDIA OG lines — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0c;
        --panel: #141413;
        --panel-elevated: #1a1a18;
        --border: #2a2a28;
        --border-subtle: #1f1f1d;
        --text: #f5f4f1;
        --muted: #8a8880;
        --faint: #5c5b56;
        --track: #2e2e2b;
        --thumb: #eceae4;
        --thumb-border: #0d0d0c;
        --focus: rgba(245, 244, 241, 0.14);
        --controls-width: 224px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.4;
        padding: 16px 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 16px;
        align-items: flex-start;
      }
      h1 { font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 2px; width: 100%; }
      .sub { color: var(--muted); font-size: 0.75rem; margin: 0 0 12px; width: 100%; line-height: 1.5; }
      .sub code { font-size: 0.6875rem; padding: 1px 5px; border-radius: 4px; background: var(--panel-elevated); border: 1px solid var(--border-subtle); color: var(--muted); }
      .preview-wrap { flex: 1 1 520px; min-width: 0; overflow-x: auto; }
      .canvas-block { width: 100%; max-width: 1200px; }
      .canvas-shell { display: block; background: #000; border-radius: 8px; border: 1px solid var(--border); line-height: 0; }
      canvas#c { width: 100%; height: auto; aspect-ratio: 2400 / 1260; display: block; }
      .controls { flex: 0 0 var(--controls-width); width: var(--controls-width); max-width: 100%; padding: 0; }
      .controls h2 { font-size: 0.625rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 28px 0 8px; }
      .controls h2:first-child { margin-top: 0; }
      .h2-row { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 8px; }
      .h2-row h2 { margin: 0; }
      .h2-row .checkbox-row { margin: 0; font-size: 0.6875rem; color: var(--muted); }
      .control { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
      .control .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .control .name { font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; }
      .control .val { font-size: 0.6875rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); flex-shrink: 0; }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 999px; background: var(--track); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--thumb-border); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
      input[type="range"]::-moz-range-track { height: 3px; border-radius: 999px; background: var(--track); border: none; }
      input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--thumb-border); box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
      input[type="color"] { width: 32px; height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-elevated); cursor: pointer; padding: 2px; flex-shrink: 0; }
      .color-row { display: flex; align-items: center; gap: 6px; }
      .color-row input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: 0.6875rem; font-family: "SF Mono", "Menlo", monospace; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-elevated); color: var(--text); }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0; }
      button { font: inherit; font-size: 0.6875rem; font-weight: 500; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-elevated); color: var(--text); cursor: pointer; }
      button:hover { background: #222220; border-color: #353532; }
      button.primary { background: #2a2a27; border-color: #3d3d39; }
      .timeline { margin-top: 8px; width: 100%; }
      .timeline input[type="range"] { width: 100%; }
      .playbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      #playToggle { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 6px; flex-shrink: 0; }
      #frameLabel { font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .checkbox-row { flex-direction: row; align-items: center; margin: 0 !important; gap: 6px; font-size: 0.6875rem; color: var(--muted); cursor: pointer; }
      .checkbox-row input { accent-color: var(--thumb); width: 13px; height: 13px; cursor: pointer; }
      select { font: inherit; font-size: 0.6875rem; font-weight: 500; width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-elevated); color: var(--text); cursor: pointer; -webkit-appearance: none; appearance: none; }
      /* Swatch grid: floats above the column on hover — does not push content */
      .control { position: relative; }
      .swatch-grid {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 100;
        grid-template-columns: repeat(10, 16px);
        gap: 3px;
        padding: 8px;
        background: var(--panel-elevated);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        width: fit-content;
        box-sizing: border-box;
      }
      .control:hover .swatch-grid { display: grid; }
      .swatch-grid::before {
        content: '';
        position: absolute;
        top: -6px;
        left: 0;
        right: 0;
        height: 6px;
      }
      .swatch-grid > div:not(.swatch) { grid-column: 1 / -1; }
      .swatch { width: 16px; height: 16px; border-radius: 3px; cursor: pointer; border: 1.5px solid transparent; transition: transform 0.1s, border-color 0.1s; }
      .swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.4); }
      .swatch.active { border-color: #fff; transform: scale(1.1); }
    </style>
  </head>
  <body>

    <aside class="controls" style="order: 1">
      <h2>Style</h2>
      <div class="control">
        <select id="preset">
          <option value="converge">Converge</option>
          <option value="speed">Speed</option>
          <option value="perspective">Perspective</option>
          <option value="gesture">Gesture</option>
          <option value="wind">Wind</option>
          <option value="planes">Planes</option>
          <option value="sphere">Sphere</option>
          <option value="parametric" selected>Parametric</option>
        </select>
      </div>

      <h2>Canvas</h2>
      <div class="control">
        <div class="actions">
          <button id="sizeOG">OG</button>
          <button id="size1080" class="primary">1080p</button>
          <button id="size4k">4K</button>
        </div>
      </div>

      <h2>Color</h2>
      <div class="control">
        <span class="row"><span class="name">Background</span></span>
        <div class="color-row">
          <input type="color" id="bgHex" value="#2D2D2B" />
          <input type="text" id="bgText" value="#2D2D2B" maxlength="7" placeholder="#RRGGBB" />
        </div>
        <div class="swatch-grid" id="bgSwatches"></div>
      </div>
      <div class="control">
        <span class="row"><span class="name">Stroke</span></span>
        <div class="color-row">
          <input type="color" id="fgHex" value="#F44E00" />
          <input type="text" id="fgText" value="#F44E00" maxlength="7" placeholder="#RRGGBB" />
        </div>
        <div class="swatch-grid" id="fgSwatches"></div>
      </div>

      <h2>Form</h2>
      <label class="control">
        <span class="row"><span class="name">Stroke width</span><span class="val" id="vStrokeW">2</span></span>
        <input type="range" id="strokeW" min="1" max="6" value="2" />
      </label>

      <div id="sphereControls" style="display:none">
        <label class="control">
          <span class="row"><span class="name">Rings</span><span class="val" id="vSphereRings">8</span></span>
          <input type="range" id="sphereRings" min="3" max="16" value="8" />
        </label>
      </div>

      <div id="parametricControls" style="display:none">
        <label class="control">
          <span class="row"><span class="name">Curves</span><span class="val" id="vParamCurves">3</span></span>
          <input type="range" id="paramCurves" min="2" max="9" value="3" />
        </label>
      </div>

      <div id="speedControls" style="display:none">
        <label class="control">
          <span class="row"><span class="name">Space</span><span class="val" id="vSpace">50</span></span>
          <input type="range" id="speedSpace" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Velocity</span><span class="val" id="vVelocity">40</span></span>
          <input type="range" id="speedVelocity" min="0" max="100" value="40" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Color</span><span class="val" id="vColor">0</span></span>
          <input type="range" id="speedColor" min="0" max="100" value="0" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Scale</span><span class="val" id="vScale">50</span></span>
          <input type="range" id="speedScale" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Position</span><span class="val" id="vPosition">50</span></span>
          <input type="range" id="speedPosition" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Dither</span><span class="val" id="vDither">0</span></span>
          <input type="range" id="speedDither" min="0" max="100" value="0" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Perspective</span><span class="val" id="vSpeedPersp">0</span></span>
          <input type="range" id="speedPersp" min="0" max="100" value="0" />
        </label>
      </div>

      <div id="perspectiveControls" style="display:none">
        <label class="control">
          <span class="row"><span class="name">Depth</span><span class="val" id="vDepth">50</span></span>
          <input type="range" id="perspDepth" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Angle</span><span class="val" id="vAngle">50</span></span>
          <input type="range" id="perspAngle" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Position</span><span class="val" id="vPerspPos">50</span></span>
          <input type="range" id="perspPosition" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Shape</span><span class="val" id="vShape">0</span></span>
          <input type="range" id="perspShape" min="0" max="100" value="0" />
        </label>
      </div>

      <div id="gestureControls" style="display:none">
        <label class="control">
          <span class="row"><span class="name">Scale</span><span class="val" id="vGestScale">50</span></span>
          <input type="range" id="gestScale" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Amplitude</span><span class="val" id="vGestAmp">50</span></span>
          <input type="range" id="gestAmp" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Waves</span><span class="val" id="vGestWaves">50</span></span>
          <input type="range" id="gestWaves" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Damping</span><span class="val" id="vGestDamp">50</span></span>
          <input type="range" id="gestDamp" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Skew</span><span class="val" id="vGestSkew">50</span></span>
          <input type="range" id="gestSkew" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Rhythm</span><span class="val" id="vGestRhythm">50</span></span>
          <input type="range" id="gestRhythm" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Position</span><span class="val" id="vGestPos">50</span></span>
          <input type="range" id="gestPos" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Fragment</span><span class="val" id="vGestFrag">0</span></span>
          <input type="range" id="gestFrag" min="0" max="100" value="0" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Height</span><span class="val" id="vGestHeight">50</span></span>
          <input type="range" id="gestHeight" min="0" max="100" value="50" />
        </label>
      </div>

      <div class="h2-row">
        <h2>Segments</h2>
        <label class="control checkbox-row">
          <input type="checkbox" id="segEnabled" />
          Enable
        </label>
      </div>
      <div id="segControls" style="display:none">
        <div class="control">
          <span class="row"><span class="name">Color</span></span>
          <div class="color-row">
            <input type="color" id="segHex" value="#EDECE8" />
            <input type="text" id="segText" value="#EDECE8" maxlength="7" />
          </div>
          <div class="swatch-grid" id="segSwatches"></div>
        </div>
        <label class="control">
          <span class="row"><span class="name">Density</span><span class="val" id="vSegDensity">50</span></span>
          <input type="range" id="segDensity" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Size</span><span class="val" id="vSegSize">50</span></span>
          <input type="range" id="segSize" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="row"><span class="name">Speed</span><span class="val" id="vSegSpeed">50</span></span>
          <input type="range" id="segSpeed" min="0" max="100" value="50" />
        </label>
      </div>

      <h2>Timing</h2>
      <label class="control">
        <span class="row"><span class="name">Total frames</span><span class="val" id="vEmergeFr">120</span></span>
        <input type="range" id="emergeFr" min="30" max="1800" value="40" />
      </label>
      <label class="control">
        <span class="row"><span class="name">FPS</span><span class="val" id="vFps">24</span></span>
        <input type="range" id="fps" min="2" max="60" value="24" />
      </label>

      <h2>Export</h2>
      <button type="button" id="exportSvg">SVG</button>
      <button type="button" id="exportGif">GIF</button>
      <button type="button" id="exportWebm">WebM</button>
      <button type="button" id="exportMp4">MP4</button>
      <span id="exportStatus" aria-live="polite" style="font-size:0.6875rem;font-weight:500;color:var(--muted);margin-left:4px;transition:opacity 0.4s;"></span>
    </aside>

    <div class="preview-wrap" style="order: 2">
      <div class="canvas-block">
        <div class="canvas-shell">
          <canvas id="c" width="2400" height="1260"></canvas>
        </div>
        <div class="timeline">
          <input type="range" id="scrub" min="0" max="0" value="0" />
        </div>
        <div class="playbar">
          <button type="button" class="primary" id="playToggle" title="Play / Pause">&#9654;</button>
          <span id="frameLabel" style="flex:1">—</span>
          <label class="control checkbox-row" style="margin:0">
            <input type="checkbox" id="loop" checked />
            Loop
          </label>
        </div>
      </div>
    </div>

    <script src="vendor/gifjs/gif.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
    <script src="og-nvidia-05-preview.js?v=20260430-wind-sweep2"></script>
  </body>
</html>
